name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build C++ engine & run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Cache CMake FetchContent (GoogleTest)
        uses: actions/cache@v4
        with:
          path: engine/build/_deps
          key: ${{ runner.os }}-gtest-${{ hashFiles('engine/CMakeLists.txt') }}

      - name: Configure CMake
        working-directory: engine
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: engine
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Run tests
        working-directory: engine/build
        run: ctest --output-on-failure --build-config Release